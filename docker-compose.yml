# docker-compose.yml — HeatGuard AI local development stack
#
# Usage:
#   docker compose up --build
#   Open: http://localhost:8080
#
# Requires the MCP server repo at ../heatguard-mcp-server (see architecture.md §15).
# Copy .env.example to .env and fill in the secrets before starting.
#
# NEVER set FAULTS_ENABLED=true in production.
# NEVER expose port 8001 outside the Docker private network in production.

services:
  mcp-server:
    build: ../heatguard-mcp-server
    environment:
      ADAPTER: simulator
      SIM_SEED_FILE: /seed/devices.yaml
      # FAULTS_ENABLED is local/test ONLY — rules.md §2.9 rule 9
      FAULTS_ENABLED: "${FAULTS_ENABLED:-false}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN}"
      APPROVAL_SIGNING_SECRET: "${APPROVAL_SIGNING_SECRET}"
    volumes:
      - ../heatguard-mcp-server/seed:/seed:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    # Expose for MCP Inspector / local debugging only — close in production
    ports: ["8001:8001"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: heatguard
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [internal]

  backend:
    build: ./backend
    environment:
      MCP_SERVER_URL: "http://mcp-server:8001/mcp"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN}"
      APPROVAL_SIGNING_SECRET: "${APPROVAL_SIGNING_SECRET}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      # Ollama on host — Linux only needs host.docker.internal via extra_hosts
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      # OpenAI / Anthropic (only used when LLM_PROVIDER matches)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}"
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/heatguard"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    # Reach Ollama running on the host (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mcp-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      - backend
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}
