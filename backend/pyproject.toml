[project]
name = "heatguard-ai-backend"
version = "0.1.0"
description = "HeatGuard AI — Safe Agentic Control for Heat Pump Fleets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Settings
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    # LangChain / LangGraph
    "langchain-core>=0.3.0,<0.4",
    "langgraph>=0.2.0,<0.3",
    "langchain-mcp-adapters>=0.1.0,<0.2.0",
    # MCP SDK (same version as the server)
    "mcp>=2.3.0",
    # LLM providers (all optional at runtime, switched by LLM_PROVIDER)
    "langchain-openai>=0.2.0,<0.3",
    "langchain-anthropic>=0.2.0,<0.3",
    "langchain-ollama>=0.2.0,<0.3",
    # DB / checkpointer
    "langgraph-checkpoint-postgres>=2.0.0",
    "asyncpg>=0.29.0,<0.30",
    "psycopg[binary,pool]>=3.1.0,<4",
    # HTTP client (for MCP Streamable HTTP transport)
    "httpx>=0.27.0,<0.28",
    # Data
    "pandas>=2.2.0,<3",
    "numpy>=1.26.0,<2",
    # Utilities
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
